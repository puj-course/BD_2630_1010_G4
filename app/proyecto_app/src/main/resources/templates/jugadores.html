<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Jugadores</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <h2 class="mb-4">Catálogo de Jugadores</h2>
    <table class="table table-striped table-bordered">
        <thead class="table-dark">
            <tr>
                <th>ID Jugador</th>
                <th>Nombre</th>
                <th>Fecha Nacimiento</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="jug : ${jugadores}">
                <td th:text="${jug.idJugador}">1</td>
                <td th:text="${jug.nombre}">Nombre</td>
                <td th:text="${jug.fechaNacimiento}">2000-01-01</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
