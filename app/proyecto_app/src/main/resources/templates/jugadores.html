<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::section})}">
<head><title>Jugadores Inscritos - FIFA 2026</title></head>
<body>
<section>
    <div class="row mb-4 align-items-center">
        <div class="col">
            <h2 class="fw-bold text-dark"><i class="fa-solid fa-users text-primary me-2"></i> Padrón Oficial de Jugadores</h2>
            <p class="text-muted">Registro oficial de futbolistas habilitados para las convocatorias del torneo.</p>
        </div>
        <div class="col-auto">
            <a href="/reportes/goleadores" class="btn btn-outline-warning btn-sm text-dark me-2"><i class="fa-solid fa-shoe-prints me-1"></i> Ranking Goleadores</a>
            <a href="/" class="btn btn-outline-secondary btn-sm"><i class="fa-solid fa-house me-1"></i> Inicio</a>
        </div>
    </div>

    <div class="card p-3 bg-white shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover text-center align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>ID Jugador</th>
                        <th class="text-start ps-3">Nombre Completo</th>
                        <th>Fecha de Nacimiento</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${jugadores == null || jugadores.empty}">
                        <td colspan="3" class="text-muted py-4">No hay jugadores registrados en el sistema.</td>
                    </tr>
                    <tr th:each="jug : ${jugadores}">
                        <td th:text="${jug.idJugador}">1</td>
                        <td class="fw-bold text-start ps-3" th:text="${jug.nombre}">Nombre</td>
                        <td th:text="${jug.fechaNacimiento}">2000-01-01</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
