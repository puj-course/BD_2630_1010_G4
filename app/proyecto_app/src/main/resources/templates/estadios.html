<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::section})}">
<head><title>Estadios Oficiales - FIFA 2026</title></head>
<body>
<section>
    <div class="row mb-4 align-items-center">
        <div class="col">
            <h2 class="fw-bold text-dark"><i class="fa-solid fa-building-columns text-success me-2"></i> Sedes y Estadios Oficiales</h2>
            <p class="text-muted">Infraestructura deportiva habilitada y aforo oficial para los encuentros del torneo.</p>
        </div>
        <div class="col-auto">
            <a href="/" class="btn btn-outline-secondary btn-sm"><i class="fa-solid fa-house me-1"></i> Inicio</a>
        </div>
    </div>

    <div class="card p-3 bg-white shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover text-center align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th class="text-start ps-3">Nombre del Estadio</th>
                        <th>Capacidad de Espectadores</th>
                        <th>Ciudad Sede (Ref)</th>
                        <th>Edición (Ref)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${estadios == null || estadios.empty}">
                        <td colspan="5" class="text-muted py-4">No hay estadios registrados en el sistema.</td>
                    </tr>
                    <tr th:each="est : ${estadios}">
                        <td th:text="${est.idEstadio}">1</td>
                        <td class="fw-bold text-start ps-3" th:text="${est.nombre}">Estadio</td>
                        <td><span class="badge bg-info text-dark fs-6 px-3" th:text="${#numbers.formatInteger(est.capacidad, 3, 'POINT')} + ' pers.'">50.000</span></td>
                        <td th:text="${est.idCiudad}">1</td>
                        <td th:text="${est.idEdicion}">1</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
