<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Administración de Estadios</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <h2 class="mb-4">Catálogo de Estadios</h2>
    <table class="table table-striped table-bordered">
        <thead class="table-dark">
            <tr>
                <th>ID Estadio</th>
                <th>Nombre</th>
                <th>Capacidad</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="est : ${estadios}">
                <td th:text="${est.idEstadio}">1</td>
                <td th:text="${est.nombre}">Estadio Ejemplo</td>
                <td th:text="${est.capacidad}">50000</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
