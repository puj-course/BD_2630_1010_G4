<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Selecciones</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <h2 class="mb-4">Catálogo de Selecciones</h2>
    <table class="table table-striped table-bordered">
        <thead class="table-dark">
            <tr>
                <th>ID Selección</th>
                <th>País</th>
                <th>ID Edición</th>
                <th>ID Federación</th>
                <th>ID Grupo</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="sel : ${selecciones}">
                <td th:text="${sel.idSeleccion}">1</td>
                <td th:text="${sel.pais}">Colombia</td>
                <td th:text="${sel.idEdicion}">1</td>
                <td th:text="${sel.idFederacion}">1</td>
                <td th:text="${sel.idGrupo}">1</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
