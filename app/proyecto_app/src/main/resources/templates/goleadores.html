<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::section})}">
<head><title>Ranking de Goleadores - FIFA 2026</title></head>
<body>
<section>
    <div class="row mb-4 align-items-center">
        <div class="col">
            <h2 class="fw-bold text-dark"><i class="fa-solid fa-shoe-prints text-warning me-2"></i> Ranking de Goleadores</h2>
            <p class="text-muted">Indicadores oficiales de anotaciones y asistencias por jugador en el torneo.</p>
        </div>
        <div class="col-auto">
            <a href="/reportes/posiciones" class="btn btn-outline-primary btn-sm"><i class="fa-solid fa-table-list me-1"></i> Ver Posiciones</a>
        </div>
    </div>

    <div th:if="${error}" class="alert alert-danger shadow-sm" th:text="${error}"></div>

    <div class="card p-3 bg-white shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover text-center align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="text-start ps-3">Jugador</th>
                        <th class="text-start">Selección</th>
                        <th>Goles Anotados</th>
                        <th>Asistencias</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${goleadores == null || goleadores.empty}">
                        <td colspan="4" class="text-muted py-4">No hay estadísticas de goles registradas todavía.</td>
                    </tr>
                    <tr th:each="row : ${goleadores}">
                        <td class="fw-bold text-start ps-3" th:text="${row[0]}">Jugador</td>
                        <td class="text-start" th:text="${row[1]}">Selección</td>
                        <td><span class="badge bg-success fs-6 px-3 py-1" th:text="${row[2]}">Goles</span></td>
                        <td class="fw-semibold text-secondary" th:text="${row[3]}">Asistencias</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
