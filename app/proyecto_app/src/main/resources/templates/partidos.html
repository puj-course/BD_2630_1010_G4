<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Partidos - Mundial</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <h2 class="mb-4">Registro de Partidos</h2>
    <table class="table table-striped table-bordered">
        <thead class="table-dark">
            <tr>
                <th>ID Partido</th>
                <th>Fecha y Hora</th>
                <th>Asistencia</th>
                <th>ID Estadio</th>
                <th>ID Fase</th>
                <th>ID Edición</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="p : ${partidos}">
                <td th:text="${p.idPartido}">1</td>
                <td th:text="${p.fechaHora}">2026-06-11 15:00</td>
                <td th:text="${p.asistenciaRegistrada}">60000</td>
                <td th:text="${p.idEstadio}">1</td>
                <td th:text="${p.idFase}">1</td>
                <td th:text="${p.idEdicion}">1</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
