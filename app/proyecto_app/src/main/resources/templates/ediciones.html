<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ediciones del Mundial</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <h2 class="mb-4">Catálogo de Ediciones del Mundial</h2>
    <table class="table table-striped table-bordered">
        <thead class="table-dark">
            <tr>
                <th>ID Edición</th>
                <th>Año</th>
                <th>Lema</th>
                <th>Fecha Inicio</th>
                <th>Fecha Fin</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="ed : ${ediciones}">
                <td th:text="${ed.idEdicion}">1</td>
                <td th:text="${ed.anio}">2026</td>
                <td th:text="${ed.lema}">Lema</td>
                <td th:text="${ed.fechaInicio}">2026-06-11</td>
                <td th:text="${ed.fechaFin}">2026-07-19</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
