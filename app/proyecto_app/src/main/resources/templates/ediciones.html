<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::section})}">
<head><title>Ediciones del Mundial - FIFA 2026</title></head>
<body>
<section>
    <div class="row mb-4 align-items-center">
        <div class="col">
            <h2 class="fw-bold text-dark"><i class="fa-solid fa-calendar-days text-primary me-2"></i> Ediciones Oficiales del Mundial</h2>
            <p class="text-muted">Historial y programación oficial de las ediciones organizadas por la FIFA.</p>
        </div>
        <div class="col-auto">
            <a href="/" class="btn btn-outline-secondary btn-sm"><i class="fa-solid fa-house me-1"></i> Inicio</a>
        </div>
    </div>

    <div class="card p-3 bg-white shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover text-center align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Año</th>
                        <th class="text-start ps-3">Lema Oficial</th>
                        <th>Fecha de Inicio</th>
                        <th>Fecha de Clausura</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${ediciones == null || ediciones.empty}">
                        <td colspan="5" class="text-muted py-4">No hay ediciones registradas en el sistema.</td>
                    </tr>
                    <tr th:each="ed : ${ediciones}">
                        <td th:text="${ed.idEdicion}">1</td>
                        <td><span class="badge bg-primary fs-6 px-3" th:text="${ed.anio}">2026</span></td>
                        <td class="fw-semibold text-start ps-3" th:text="${ed.lema}">Lema</td>
                        <td th:text="${ed.fechaInicio}">2026-06-11</td>
                        <td th:text="${ed.fechaFin}">2026-07-19</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
