<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::section})}">
<head><title>Grupos del Torneo - FIFA World Cup</title></head>
<body>
<section>
    <div class="row mb-4 align-items-center">
        <div class="col">
            <h2 class="fw-bold text-dark"><i class="fa-solid fa-layer-group text-warning me-2"></i> Conformación de Grupos</h2>
            <p class="text-muted">Distribución oficial de grupos por edición para la primera fase del campeonato.</p>
        </div>
        <div class="col-auto">
            <a href="/selecciones" class="btn btn-outline-primary btn-sm me-2"><i class="fa-solid fa-flag me-1"></i> Ver Selecciones</a>
            <a href="/" class="btn btn-outline-secondary btn-sm"><i class="fa-solid fa-house me-1"></i> Inicio</a>
        </div>
    </div>

    <div class="card p-3 bg-white shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover text-center align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>ID Grupo</th>
                        <th class="text-start ps-3">Identificador del Grupo</th>
                        <th>Edición (Ref)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${grupos == null || grupos.empty}">
                        <td colspan="3" class="text-muted py-4">No hay grupos registrados en el sistema.</td>
                    </tr>
                    <tr th:each="g : ${grupos}">
                        <td th:text="${g.idGrupo}">1</td>
                        <td class="fw-bold text-start ps-3" th:text="${g.nombre}">Grupo A</td>
                        <td><span class="badge bg-primary px-3" th:text="'Edición #' + ${g.idEdicion}">1</span></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
